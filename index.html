<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HONEY — планер маркетингу</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F0A81C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F6;--surface:#FFFFFF;--surface2:#F7F8FA;--ink:#1C2030;--muted:#646A7C;--line:#E2E4EA;
  --honey:#F0A81C;--honey-soft:#FDF1D4;--honey-ink:#6E4A00;--fs:1;
  --danger:#C63737;--danger-soft:#FBE6E6;--ok:#2B8454;--ok-soft:#E1F2E8;--blue:#3471B8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#13151B;--surface:#1C1F27;--surface2:#232731;--ink:#ECEDF2;--muted:#9BA1B0;--line:#2E333F;
  --honey:#F2B233;--honey-soft:#3A2F17;--honey-ink:#F7CE7A;--danger:#EF6B6B;--danger-soft:#3B1F22;--ok:#5CC08B;--ok-soft:#1B3326;--blue:#6BA3E6;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#13151B;--surface:#1C1F27;--surface2:#232731;--ink:#ECEDF2;--muted:#9BA1B0;--line:#2E333F;
  --honey:#F2B233;--honey-soft:#3A2F17;--honey-ink:#F7CE7A;--danger:#EF6B6B;--danger-soft:#3B1F22;--ok:#5CC08B;--ok-soft:#1B3326;--blue:#6BA3E6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(15px * var(--fs))/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;align-self:start;height:100vh;padding:22px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.brand{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px;margin:0 8px 22px;letter-spacing:.2px}
.brand small{display:block;font:500 11.5px/1.2 Manrope,sans-serif;color:var(--muted);letter-spacing:0}
.hexlogo{width:26px;height:30px;flex:none;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:var(--surface2);color:var(--ink)}
.navbtn.on{background:var(--honey-soft);color:var(--honey-ink)}
.navbtn .cnt{margin-left:auto;font-size:12px;background:var(--surface2);border-radius:999px;padding:0 7px;color:var(--muted)}
.navbtn.on .cnt{background:var(--surface)}
.side .spacer{flex:1}
.sync{font-size:12px;color:var(--muted);padding:8px 12px;display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)}
main{padding:26px 30px 110px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
h1{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:calc(24px * var(--fs));margin:0;letter-spacing:.2px}
h2{font-size:16px;margin:26px 0 10px;font-weight:800}
.sub{color:var(--muted);font-size:calc(13.5px * var(--fs))}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--honey);border-color:var(--honey);color:#2A1D00}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted);font-size:calc(13.5px * var(--fs))}
.seg button.on{background:var(--honey-soft);color:var(--honey-ink)}
.nav3{display:inline-flex;align-items:center;gap:4px}
.nav3 .lbl{min-width:170px;text-align:center;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;font-size:calc(12.5px * var(--fs));color:var(--muted);font-weight:600}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;font-size:calc(14.5px * var(--fs));color:var(--ink);font-weight:500}
textarea{resize:vertical;min-height:70px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.filters select{flex:0 1 190px}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:calc(13.5px * var(--fs));color:var(--muted);font-weight:600;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-size:calc(22px * var(--fs));font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:calc(12.5px * var(--fs));color:var(--muted);font-weight:600}
.stat.warn b{color:var(--danger)}
.stat.good b{color:var(--ok)}
/* tasks */
.group{margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-left:4px solid var(--c,#999);user-select:none}
.ghead b{font-weight:800}
.ghead .sub{margin-left:auto}
.ghead .car{transition:transform .15s;color:var(--muted)}
.group.closed .car{transform:rotate(-90deg)}
.group.closed .glist{display:none}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.task:hover{background:var(--surface2)}
.task .body{min-width:0;flex:1}
.task .t{font-weight:600;overflow-wrap:anywhere;font-size:calc(15px * var(--fs))}
.meta{display:flex;flex-wrap:wrap;gap:5px 7px;margin-top:5px;font-size:calc(12.5px * var(--fs));color:var(--muted);align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip.p1{background:var(--danger-soft);border-color:transparent;color:var(--danger);font-weight:700}
.chip.p2{background:var(--honey-soft);border-color:transparent;color:var(--honey-ink);font-weight:700}
.chip.st{border-style:dashed}
.task.over .due{color:var(--danger);font-weight:700}
.task.isdone .t{text-decoration:line-through;color:var(--muted)}
.chk{width:24px;height:27px;flex:none;border:0;padding:0;cursor:pointer;background:var(--muted);opacity:.55;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative;margin-top:-1px}
.chk::before{content:"";position:absolute;inset:2px;background:var(--surface);clip-path:inherit}
.chk span{position:relative;font-weight:800;font-size:13px;color:#2A1D00;opacity:0}
.chk:hover{opacity:1;background:var(--honey)}
.chk:hover span{opacity:.35;color:var(--honey-ink)}
.chk.done{opacity:1;background:var(--honey)}
.chk.done::before{background:var(--honey)}
.chk.done span{opacity:1;color:#2A1D00}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.ava{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;font-size:calc(10.5px * var(--fs));flex:none;letter-spacing:.2px}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);font-size:calc(12.5px * var(--fs))}
.who.none{color:var(--muted);font-weight:600}
.kc .who{margin-bottom:5px}
.kc .ava{width:24px;height:24px;font-size:calc(11px * var(--fs))}
.lock{color:var(--honey-ink);background:var(--honey-soft);border-radius:5px;padding:0 5px;font-size:calc(11px * var(--fs));font-weight:700}
/* inbox */
.irow{display:grid;grid-template-columns:minmax(0,1fr) 140px 170px 150px auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.irow .t{font-weight:600;overflow-wrap:anywhere}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:170px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--honey);box-shadow:inset 0 3px 0 var(--honey)}
.day.wknd{background:var(--surface2)}
.dh{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.dh span{font-size:12px;color:var(--muted);font-weight:600}
.load{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.load i{display:block;height:100%;background:var(--ok)}
.load i.hi{background:var(--honey)}
.load i.ov{background:var(--danger)}
.mini{font-size:calc(12.5px * var(--fs));border-radius:7px;padding:5px 7px;background:var(--surface2);border-left:3px solid var(--c,#999);cursor:pointer;overflow-wrap:anywhere;line-height:1.3}
.mini:hover{background:var(--honey-soft)}
.mini.dn{opacity:.55;text-decoration:line-through}
.mini.dueflag{background:transparent;border:1px dashed var(--line);border-left:3px solid var(--danger)}
.dfoot{margin-top:auto;font-size:calc(12px * var(--fs));color:var(--muted);display:flex;justify-content:space-between}
.dfoot .ov{color:var(--danger);font-weight:700}
/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:calc(13.5px * var(--fs))}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:calc(12px * var(--fs));color:var(--muted);font-weight:700;background:var(--surface2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.cur td{background:var(--honey-soft)}
.bar{height:8px;border-radius:4px;background:var(--surface2);min-width:90px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.warn{color:var(--danger);font-weight:700}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .wd{background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted);padding:6px 8px}
.cell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cell:hover{background:var(--surface2)}
.cell.out{background:var(--surface2);opacity:.6}
.cell.sel{box-shadow:inset 0 0 0 2px var(--honey)}
.cell .num{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.cell.today .num b{background:var(--honey);color:#2A1D00;border-radius:999px;padding:0 7px}
.cchip{font-size:calc(11.5px * var(--fs));padding:2px 5px;border-radius:5px;background:var(--surface2);border-left:3px solid var(--c,#999);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip.dn{opacity:.5;text-decoration:line-through}
.cmore{font-size:11.5px;color:var(--muted);font-weight:700}
.dots{display:none;gap:3px;flex-wrap:wrap}
/* gantt */
.gantt th,.gantt td{padding:0;height:32px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.gantt th{padding:4px 0;text-align:center;font-size:11px}
.gantt td.name,.gantt th.name{position:sticky;left:0;z-index:2;background:var(--surface);min-width:250px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;text-align:left;font-size:13px;cursor:pointer}
.gantt th.name{background:var(--surface2)}
.gantt td.w{min-width:36px;position:relative}
.gantt td.w.cur,.gantt th.cur{background:var(--honey-soft)}
.gantt .gb{position:absolute;inset:8px 0;background:var(--c,#999);opacity:.85}
.gantt .gb.s{border-radius:6px 0 0 6px;left:3px}
.gantt .gb.e{border-radius:0 6px 6px 0;right:3px}
.gantt .gb.s.e{border-radius:6px}
.gantt tr.dn .gb{opacity:.3}
.gantt tr.ovr td.name{color:var(--danger);font-weight:700}
/* reports */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list .task:first-child{border-top:0}
/* settings */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sets textarea{min-height:180px;font-size:calc(13.5px * var(--fs))}
/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 290px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 210px);scroll-snap-align:start;transition:box-shadow .12s}
.col.drop{box-shadow:0 0 0 2px var(--honey)}
.colh{padding:10px 12px 8px;border-top:4px solid var(--c,#999);border-radius:12px 12px 0 0;background:var(--surface);border-bottom:1px solid var(--line)}
.colh b{font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.colh b span{font-size:calc(12.5px * var(--fs));color:var(--muted);font-weight:700}
.colh .sub{font-size:12px}
.colb{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:60px}
.lane{font-size:calc(12px * var(--fs));font-weight:800;color:var(--muted);padding:6px 2px 0;display:flex;justify-content:space-between}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.kc:hover{border-color:var(--muted)}
.kc[draggable=true]{cursor:grab}
.kc.dragging{opacity:.4}
.kc.over{border-left:3px solid var(--danger)}
.kc.isdone .kt{text-decoration:line-through;color:var(--muted)}
.kc .chk{width:19px;height:22px}
.kt{font-weight:600;font-size:calc(14px * var(--fs));line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kc .meta{font-size:calc(12px * var(--fs));margin-top:6px;gap:4px 6px}
.kc.over .due{color:var(--danger);font-weight:700}
.kc{position:relative}
.kc .body{flex:1;min-width:0}
.kc .kt{padding-right:22px}
.kedbtn{position:absolute;top:5px;right:5px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:2px 6px;font-size:14px;opacity:0}
.kedbtn:hover{background:var(--surface2);color:var(--ink)}
.kc:hover .kedbtn,.kc.open .kedbtn,.kedbtn:focus-visible{opacity:1}
@media (hover:none){.kedbtn{opacity:.8}}
.kc.open{border-color:var(--honey);cursor:default}
.kedit{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);cursor:default}
.kedit label{display:flex;flex-direction:column;font-size:10.5px;color:var(--muted);font-weight:700;gap:2px;min-width:0}
.kedit select,.kedit input{font-size:12.5px;padding:4px 6px;border-radius:6px;width:100%}
.kedit .row{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.kedit .row .btn{padding:3px 8px;font-size:12px}
.addc{border:1px dashed var(--line);background:transparent;border-radius:9px;padding:7px;color:var(--muted);font-weight:600;cursor:pointer;font-size:13px}
.addc:hover{color:var(--ink);border-color:var(--muted)}
/* dialog */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(720px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(15,17,24,.45)}
.dlg{display:flex;flex-direction:column;max-height:92vh}
.dlg header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font-size:17px;font-weight:800}
.dlg .bd{padding:18px 20px;overflow:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.dlg .bd .s2{grid-column:span 2}.dlg .bd .s3{grid-column:span 3}.dlg .bd .s6{grid-column:span 6}
.dlg footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fab{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:100;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hint{font-size:calc(12.5px * var(--fs));color:var(--muted);margin-top:8px}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11.5px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);gap:0;scrollbar-width:none}
  nav.side::-webkit-scrollbar{display:none}
  .brand,.side .spacer,.sync,.navbtn .cnt,.side .newbtn{display:none}
  .navbtn{flex-direction:column;gap:2px;font-size:calc(12px * var(--fs));padding:6px 10px;flex:1 0 auto;align-items:center}
  main{padding:16px 14px 150px}
  h1{font-size:calc(21px * var(--fs))}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .irow{grid-template-columns:1fr 1fr}
  .irow .t{grid-column:1/-1}
  .cell{min-height:64px;padding:4px}
  .cell .cchip,.cell .cmore{display:none}
  .cell .dots{display:flex}
  .dlg .bd{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dlg .bd .s2,.dlg .bd .s3{grid-column:span 1}.dlg .bd .s6{grid-column:span 2}
  dialog{width:100vw;max-width:100vw;max-height:100%;height:100%;border-radius:0;margin:0}
  .dlg{max-height:100%;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border:0;background:var(--honey);color:#2A1D00;font-size:28px;font-weight:700;align-items:center;justify-content:center;cursor:pointer;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  .nav3 .lbl{min-width:0}
  .col{flex-basis:84vw;max-height:none}
  .board{scroll-snap-type:x mandatory}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Нова задача">+</button>
<dialog id="dlg"></dialog>

<script>
(function(){
'use strict';
/* ---------- defaults (довідники з таблиці) ---------- */
const DEFAULT_LISTS={
  dirs:['Загальне','Сад','Preschool','Ліцей','Муз. школа','Honey Camp','Honey Hub','Honey Events','Art & Coffee','Honey Theatre','Honey Coffee','Music days in UA','Освітній Фестіваль','Партнерство','Кейтеринг / Кухня','Honey Weekend','Новий бізнес-напрямок','Особисте / адмін','Гуртки','Культурний хаб'],
  period:['Разова','1 / тиж','1/ два тиж','1/ місяць','1/ рік'],
  func:['Аналітика','Блогери / амбасадори / PR медіа','Бренд / дизайн / креативи','Вн. реклама по Академії','Зовнішня / офлайн реклама','Івенти / офлайн-активності','Контекст. реклама (Google Ads)','Контент-стратегія та плани','Копірайтинг','Лендинги','Мітки на ГКартах / Репутація / Відгуки','Партнери','Перс. комунікація з існу. клієнтами','Планування маркет. акцій','Програма лояльності / бонусна','Промо','Сайт','Стратегія та позиціонування','Таргет / платна реклама','Фото / відео продакшн','CRM / DB marketing','SMM'],
  status:['Заплановано','В роботі','Виконано','Перенесено','Скасовано','Очікує плану'],
  prio:['1 — Терм.','2 — Висок.','3 — Серед.','4 — Низьк.'],
  owner:['Павловский С.','Денчик К.','Маркетолог -2','Аналитик','Салюкова К.','Зозуля В.','Богдан','Соболева А.'],
  type:['Опер','Страт','Х'],
  norm:8
};
let LISTS=JSON.parse(JSON.stringify(DEFAULT_LISTS));
const tasks=new Map();
let db=null, dl=null, mcp=null, exportsList=[], mode='loading', loaded=false, editing=null;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s))return null;const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const today=()=>iso(new Date());
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);}
const fmt=s=>{const d=parse(s);return d?pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2):'';};
const fmtS=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1);
const MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MON_S=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;};
const h=n=>(Math.round(n*10)/10).toLocaleString('uk-UA',{minimumFractionDigits:1,maximumFractionDigits:1});
const isDone=t=>t.status==='Виконано';
const isClosed=t=>t.status==='Виконано'||t.status==='Скасовано';
const deadline=t=>t.due||t.start||'';
const isOver=t=>!isClosed(t)&&!!deadline(t)&&deadline(t)<today();
const prank=p=>p?parseInt(p,10)||9:9;
const PAL=['#E0A020','#3471B8','#2B8454','#B8527A','#7B61C9','#D0662B','#1F9AA0','#8C7A3A','#C23B5B','#4F7A28','#5C6BC0','#A0522D','#00897B','#9C27B0','#607D8B','#E07A5F','#3D5A80','#6FA287','#C9A227','#6D597A','#B56576','#4A90A4'];
const dirColor=d=>{if(!d)return '#9AA0AE';let i=LISTS.dirs.indexOf(d);if(i<0){i=7;for(const c of d)i=(i*31+c.charCodeAt(0))>>>0;}return PAL[i%PAL.length];};
const workdays=(a,b)=>{let n=0;for(let d=parse(a);iso(d)<=b;d=addDays(d,1)){const w=d.getDay();if(w!==0&&w!==6)n++;}return n;};
const all=()=>[...tasks.values()];
const sortT=l=>l.sort((a,b)=>(isOver(b)-isOver(a))||(isClosed(a)-isClosed(b))||(prank(a.prio)-prank(b.prio))||String(deadline(a)||'9').localeCompare(String(deadline(b)||'9'))||(num(a.n)-num(b.n)));
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800);}

/* ---------- state ---------- */
const S={view:'today',day:today(),q:'',fDir:'',fOwner:'',fStatus:'',showDone:false,group:'dir',closed:new Set(),
  planMode:'week',planAnchor:today(),calMode:'month',calAnchor:today(),calDay:today(),ganttDir:'',ganttDone:false,
  mine:false,kbMine:false,kbSort:'date',kbAll:false,kbOpen:new Set(),kbDesc:false,kbDone:false,kbEmpty:false,kbOwner:'',kbQ:'',repMode:'week',repAnchor:today(),repFrom:'',repTo:''};

/* ---------- storage ---------- */
const LKEY='honey-planner-v1';
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LKEY)||'null');if(r){(r.tasks||[]).forEach(t=>tasks.set(t.id,t));if(r.lists)LISTS=Object.assign({},DEFAULT_LISTS,r.lists);}}catch(e){}loaded=true;}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({tasks:all(),lists:LISTS}));}catch(e){toast('Браузер не дав зберегти дані');}}
const newId=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* ---------- Google Sheets API (Apps Script) ---------- */
const CKEY='honey-conn-v1',QKEY='honey-queue-v1',CACHE='honey-cache-v1';
let CONN=null,PROFILE=null,queue=[],sync={state:'idle',at:null,err:''},flushing=false;
const PKEY='honey-profile-v1';
try{PROFILE=localStorage.getItem(PKEY)||null;}catch(e){}
try{CONN=JSON.parse(localStorage.getItem(CKEY)||'null');queue=JSON.parse(localStorage.getItem(QKEY)||'[]');}catch(e){}
const saveQ=()=>{try{localStorage.setItem(QKEY,JSON.stringify(queue));}catch(e){}};
function saveCache(){try{localStorage.setItem(CACHE,JSON.stringify({tasks:all(),lists:LISTS,exports:exportsList,at:sync.at}));}catch(e){}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c){tasks.clear();(c.tasks||[]).forEach(t=>tasks.set(t.id,t));if(c.lists)LISTS=Object.assign({},DEFAULT_LISTS,c.lists);exportsList=c.exports||[];sync.at=c.at||null;loaded=true;}}catch(e){}}
class ApiError extends Error{constructor(code,msg){super(msg||code);this.code=code;}}
async function api(action,payload,conn){
  const c=conn||CONN;if(!c)throw new ApiError('no_conn');
  let r;
  try{r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,key:c.key,user:PROFILE||''},payload||{})),redirect:'follow'});}
  catch(e){throw new ApiError('network','Немає зв’язку з Google');}
  let j;try{j=await r.json();}catch(e){throw new ApiError('bad_response','Сервер повернув не JSON — перевірте URL розгортання (має закінчуватися на /exec) і доступ «Усі»');}
  if(!j.ok&&!j.conflict){const M={forbidden:'Це особиста задача іншого користувача',unauthorized:'Невірний ключ доступу',no_title:'Порожній текст задачі'};throw new ApiError(j.error||'server',M[j.error]||j.message||j.error);}
  return j;
}
function applyQueued(){queue.forEach(op=>{if(op.op==='upsert')tasks.set(op.task.id,Object.assign({},tasks.get(op.task.id)||{},op.task));else if(op.op==='delete')tasks.delete(op.id);});}
async function refresh(silent){
  if(!CONN)return;
  if(queue.length)await flush();
  sync.state='sync';if(!silent)renderNav();
  try{
    const j=await api('list');
    tasks.clear();(j.tasks||[]).forEach(t=>tasks.set(t.id,t));applyQueued();
    LISTS=Object.assign({},DEFAULT_LISTS,j.lists||{});exportsList=j.exports||[];
    loaded=true;sync={state:'ok',at:new Date().toISOString(),err:''};saveCache();
  }catch(e){sync.state=e.code==='network'?'offline':'error';sync.err=e.message;if(e.code==='unauthorized')sync.err='Невірний ключ доступу';}
  render();
}
async function flush(){
  if(flushing||!CONN)return;flushing=true;
  try{
    while(queue.length){
      const op=queue[0];let j;
      try{j=op.op==='upsert'?await api('upsert',{task:op.task,base:op.base}):op.op==='delete'?await api('delete',{id:op.id}):await api('saveLists',{lists:op.lists});}
      catch(e){sync.state=e.code==='network'?'offline':'error';sync.err=e.message;
        if(e.code!=='network'&&e.code!=='bad_response'){queue.shift();saveQ();toast('Не збережено в таблиці: '+e.message);continue;}
        break;}
      queue.shift();saveQ();
      if(op.op==='upsert'&&j.conflict&&j.task){tasks.set(j.task.id,j.task);toast('Цю задачу вже змінив інший користувач — показано актуальну версію');}
      else if(op.op==='upsert'&&j.task){const cur=tasks.get(j.task.id);if(!queue.some(q=>q.op==='upsert'&&q.task.id===j.task.id))tasks.set(j.task.id,j.task);else if(cur)cur.updatedAt=j.task.updatedAt;
        queue.forEach(q=>{if(q.op==='upsert'&&q.task.id===j.task.id)q.base=j.task.updatedAt;});}
      else if(op.op==='saveLists'&&j.lists)LISTS=Object.assign({},DEFAULT_LISTS,j.lists);
      sync={state:'ok',at:new Date().toISOString(),err:''};
    }
  }finally{flushing=false;saveCache();render();}
}
async function putTask(t){
  const id=t.id||newId();const prev=tasks.get(id);
  const body=Object.assign({},t,{id});delete body.nextMade;
  tasks.set(id,Object.assign({},t,{id}));
  const base=prev?(prev.updatedAt||sync.at||null):null;
  const i=queue.findIndex(q=>q.op==='upsert'&&q.task.id===id&&q!==queue[0]);
  if(i>0)queue[i]={op:'upsert',task:body,base:queue[i].base};else queue.push({op:'upsert',task:body,base});
  saveQ();saveCache();flush();
  return id;
}
async function removeTask(id){tasks.delete(id);queue=queue.filter((q,k)=>k===0||!(q.op==='upsert'&&q.task.id===id));queue.push({op:'delete',id});saveQ();saveCache();flush();}
async function putLists(){queue.push({op:'saveLists',lists:LISTS});saveQ();flush();}
const nextN=()=>all().reduce((m,t)=>Math.max(m,num(t.n)),0)+1;

async function boot(){
  loadCache();
  if(!CONN){S.view='connect';loaded=true;render();return;}
  if(!PROFILE)S.view='profile';
  render();refresh();
  setInterval(()=>{if(document.visibilityState==='visible')refresh(true);},45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(true);});
  window.addEventListener('online',()=>refresh(true));
}

/* ---------- navigation ---------- */
const ICON={
 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 connect:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
 today:'<path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/>',
 tasks:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/>',
 kanban:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',
 inbox:'<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/>',
 plan:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h7"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7 13h2v2H7zM11 13h2v2h-2zM15 13h2v2h-2zM7 17h2v1H7z"/>',
 rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const VIEWS_ALL=[['today','Сьогодні'],['tasks','Задачі'],['kanban','Канбан'],['inbox','Без дати'],['plan','План'],['cal','Календар'],['rep','Звіти'],['set','Довідники']];
function renderNav(){
  const VIEWS=!CONN?[['connect','Підключення']]:!PROFILE?[['profile','Профіль']]:VIEWS_ALL;
  const openN=all().filter(t=>!isClosed(t)).length;
  const inboxN=all().filter(t=>!isClosed(t)&&!t.start).length;
  const overN=all().filter(isOver).length;
  const cnt={today:overN||'',tasks:openN||'',inbox:inboxN||''};
  $('#nav').innerHTML=`<div class="brand"><div class="hexlogo"></div><div>HONEY<small>планер маркетингу</small></div></div>`+
   VIEWS.map(([k,l])=>`<button class="navbtn ${S.view===k?'on':''}" data-view="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}${cnt[k]?`<span class="cnt">${cnt[k]}</span>`:''}</button>`).join('')+
   `<div class="spacer"></div><button class="btn pri newbtn" data-new="1">+ Нова задача</button>
   <div class="sync ${sync.state==='ok'&&!queue.length?'ok':''}" title="${esc(sync.err||'')}"><i style="${sync.state==='error'?'background:var(--danger)':sync.state==='offline'?'background:var(--honey)':''}"></i>${!CONN?'Не підключено':sync.state==='sync'?'Синхронізація…':sync.state==='offline'?'Офлайн'+(queue.length?' · '+queue.length+' у черзі':''):sync.state==='error'?'Помилка синхронізації':'Google Таблиця'+(queue.length?' · зберігаю '+queue.length:sync.at?' · '+new Date(sync.at).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}):'')}</div>
   ${CONN?'<button class="navbtn" data-act="sync" style="font-size:12.5px">⟳ Оновити зараз</button>':''}`;
}

/* ---------- task row ---------- */
function taskRow(t,opt){
  opt=opt||{};const over=isOver(t),done=isDone(t);
  return `<div class="task ${over?'over':''} ${done?'isdone':''}" data-edit="${t.id}">
  <button class="chk ${done?'done':''}" data-toggle="${t.id}" aria-label="${done?'Повернути в роботу':'Позначити виконаною'}" title="${done?'Повернути в роботу':'Виконано'}"><span>✓</span></button>
  <div class="body"><div class="t">${esc(t.title)}</div><div class="meta">
  ${t.n?`<span>№${esc(t.n)}</span>`:''}
  ${t.dir&&!opt.noDir?`<span class="chip"><i class="dot" style="background:${dirColor(t.dir)}"></i>${esc(t.dir)}</span>`:''}
  ${who(t.owner)}
  ${isPersonal(t)?'<span class="lock">🔒 особиста</span>':''}
  ${t.prio&&prank(t.prio)<=2?`<span class="chip p${prank(t.prio)}">${esc(t.prio)}</span>`:(t.prio?`<span class="chip">${esc(t.prio)}</span>`:'')}
  ${t.status&&!done&&t.status!=='Заплановано'?`<span class="chip st">${esc(t.status)}</span>`:''}
  <span class="due">${t.start?fmt(t.start):'без дати'}${t.due?' → '+fmt(t.due):''}${over?' · прострочено':''}</span>
  ${num(t.plan)||num(t.fact)?`<span>${h(num(t.plan))}${num(t.fact)?' / '+h(num(t.fact)):''} год</span>`:''}
  ${t.comment?`<span title="${esc(t.comment)}">💬</span>`:''}
  </div></div></div>`;
}
const emptyBox=(title,txt)=>`<div class="empty"><b>${title}</b>${txt||''}</div>`;

/* ---------- view: today ---------- */
function vToday(){
  const d=S.day;
  const open=sortT(all().filter(t=>!isClosed(t)&&t.start&&t.start<=d));
  const over=open.filter(t=>deadline(t)<d);
  const plan=open.reduce((s,t)=>s+num(t.plan),0);
  const dow=parse(d).getDay();const norm=(dow===0||dow===6)?0:num(LISTS.norm);
  const doneToday=all().filter(t=>isDone(t)&&t.doneAt===d);
  const soon=sortT(all().filter(t=>!isClosed(t)&&t.start>d&&t.start<=iso(addDays(parse(d),7))));
  return `<div class="head"><h1>Сьогодні</h1><div class="nav3">
   <button class="btn sm" data-dayshift="-1" aria-label="Попередній день">‹</button><input type="date" id="dayPick" value="${d}"><button class="btn sm" data-dayshift="1" aria-label="Наступний день">›</button>
   ${d!==today()?'<button class="btn sm ghost" data-daytoday="1">Сьогодні</button>':''}</div></div>
  <div class="stats">
   <div class="stat"><b>${open.length}</b><span>відкрито на дату</span></div>
   <div class="stat ${over.length?'warn':''}"><b>${over.length}</b><span>прострочено</span></div>
   <div class="stat"><b>${h(plan)}</b><span>план, год</span></div>
   <div class="stat"><b>${h(norm)}</b><span>норма, год</span></div>
   <div class="stat ${plan>norm?'warn':''}"><b>${h(Math.max(0,plan-norm))}</b><span>овертайм, год</span></div>
   <div class="stat good"><b>${doneToday.length}</b><span>виконано за день</span></div>
  </div>
  <div class="list">${open.length?open.map(t=>taskRow(t)).join(''):emptyBox('На цю дату все закрито','Нові задачі з’являться тут у день взяття в роботу.')}</div>
  ${doneToday.length?`<h2>Виконано цього дня</h2><div class="list">${doneToday.map(t=>taskRow(t)).join('')}</div>`:''}
  ${soon.length?`<h2>Наступні 7 днів</h2><div class="list">${soon.map(t=>taskRow(t)).join('')}</div>`:''}`;
}

/* ---------- view: tasks ---------- */
function filtered(){
  const q=S.q.trim().toLowerCase();
  return all().filter(t=>(S.showDone||!isClosed(t))
    &&(!S.fDir||(t.dir||'')===(S.fDir==='__none'?'':S.fDir))
    &&(!S.fOwner||(t.owner||'')===(S.fOwner==='__none'?'':S.fOwner))
    &&(!S.fStatus||(S.fStatus==='__over'?isOver(t):t.status===S.fStatus))
    &&(!S.mine||mineT(t))
    &&(!q||((t.title||'')+' '+(t.comment||'')+' '+(t.n||'')).toLowerCase().includes(q)));
}
const opts=(arr,sel,empty)=>(empty!=null?`<option value="">${empty}</option>`:'')+arr.map(v=>`<option ${v===sel?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('');
function vTasks(){
  const list=filtered();
  const key={dir:'dir',owner:'owner',status:'status',func:'func'}[S.group];
  let body='';
  if(!loaded)body=emptyBox('Завантажую задачі…');
  else if(!list.length)body=`<div class="card">${emptyBox(all().length?'Нічого не знайдено':'Задач поки немає',all().length?'Змініть фільтри або пошук.':'Додайте першу задачу або імпортуйте CSV з Google Таблиці в «Довідниках».')}</div>`;
  else if(!key)body=`<div class="list">${sortT(list).map(t=>taskRow(t)).join('')}</div>`;
  else{

/* ---------- view: kanban ---------- */
const ST_ORDER=['В роботі','Заплановано','Очікує плану','Перенесено','Виконано','Скасовано'];
function kbKey(t){
  if(S.kbSort==='status'){const i=ST_ORDER.indexOf(t.status||'Очікує плану');return [isOver(t)&&!isClosed(t)?-1:(i<0?9:i)];}
  if(S.kbSort==='prio')return [prank(t.prio)];
  return [deadline(t)?0:1];
}
function kbLane(t){
  if(S.kbSort==='status')return isOver(t)?'Прострочено':(t.status||'Очікує плану');
  if(S.kbSort==='prio')return t.prio||'Без пріоритету';
  if(!deadline(t))return 'Без дати';
  const d=deadline(t),t0=today(),w=iso(addDays(monday(new Date()),6));
  if(isClosed(t))return 'Закриті';
  return d<t0?'Прострочено':d===t0?'Сьогодні':d<=w?'Цей тиждень':'Пізніше';
}
function kbSorted(l){
  const dir=S.kbDesc?-1:1;
  return l.sort((a,b)=>{const ka=kbKey(a),kb=kbKey(b);
    if(S.kbSort==='date'){if(ka[0]!==kb[0])return ka[0]-kb[0];if(isClosed(a)!==isClosed(b))return isClosed(a)-isClosed(b);return dir*String(deadline(a)).localeCompare(String(deadline(b)))||prank(a.prio)-prank(b.prio);}
    return dir*(ka[0]-kb[0])||String(deadline(a)||'9').localeCompare(String(deadline(b)||'9'))||(num(a.n)-num(b.n));});
}
function kCard(t){
  const over=isOver(t),done=isDone(t);
  const open=S.kbAll||S.kbOpen.has(t.id);

   <label>Статус<select data-inline="${t.id}" data-field="status">${opts(LISTS.status,t.status||'','—')}</select></label>

   <label>Виконавець<select data-inline="${t.id}" data-field="owner">${opts(LISTS.owner,t.owner||'','—')}</select></label>
   <label>Напрям<select data-inline="${t.id}" data-field="dir">${opts(LISTS.dirs,t.dir||'','—')}</select></label>
   <label>Взяти в роботу<input type="date" data-inline="${t.id}" data-field="start" value="${esc(t.start||'')}"></label>
   <label>Строк<input type="date" data-inline="${t.id}" data-field="due" value="${esc(t.due||'')}"></label>
   <label>План, год<input type="number" step="0.5" min="0" data-inline="${t.id}" data-field="plan" value="${esc(t.plan==null?'':t.plan)}"></label>
   <label>Факт, год<input type="number" step="0.5" min="0" data-inline="${t.id}" data-field="fact" value="${esc(t.fact==null?'':t.fact)}"></label>
   <div class="row"><button class="btn" data-kbshift="${t.id}:1" title="Перенести старт і строк на 1 день">+1 день</button><button class="btn" data-kbshift="${t.id}:7" title="Перенести старт і строк на тиждень">+1 тиждень</button><button class="btn ghost" data-edit="${t.id}">Уся картка</button></div>

  <button class="kedbtn" data-kbopen="${t.id}" aria-label="${open?'Згорнути редагування':'Швидке редагування'}" title="${open?'Згорнути':'Змінити на картці'}">${open?'✕':'✎'}</button>
  <button class="chk ${done?'done':''}" data-toggle="${t.id}" aria-label="${done?'Повернути в роботу':'Позначити виконаною'}"><span>✓</span></button>
  <div class="body">${who(t.owner)}${isPersonal(t)?' <span class="lock">🔒</span>':''}<div class="kt">${esc(t.title)}</div><div class="meta">
  ${t.prio?`<span class="chip ${prank(t.prio)<=2?'p'+prank(t.prio):''}">${esc(t.prio)}</span>`:''}
  ${t.status&&S.kbSort!=='status'&&!done?`<span class="chip st">${esc(t.status)}</span>`:''}
  <span class="due">${deadline(t)?(t.due?'до '+fmt(t.due):fmt(t.start)):'без дати'}</span>
  ${num(t.plan)?`<span>${h(num(t.plan))} год</span>`:''}
  </div>${ed}</div></div>`;
}
function vKanban(){
  const q=S.kbQ.trim().toLowerCase();

   <button class="btn sm" data-kbdesc="1" title="Змінити напрямок сортування">${S.kbDesc?'↓ Спадання':'↑ Зростання'}</button></div>
  <div class="filters"><input type="search" id="kbQ" placeholder="Пошук на дошці" value="${esc(S.kbQ)}">
   <select id="kbOwner" aria-label="Виконавець"><option value="">Усі виконавці</option>${opts(LISTS.owner,S.kbOwner)}<option value="__none" ${S.kbOwner==='__none'?'selected':''}>Без виконавця</option></select>
   <label class="tog"><input type="checkbox" id="kbDone" ${S.kbDone?'checked':''}> Показати закриті</label>

/* ---------- view: plan ---------- */
function periodNav(label,key){return `<div class="nav3"><button class="btn sm" data-shift="${key}:-1" aria-label="Назад">‹</button><span class="lbl">${label}</span><button class="btn sm" data-shift="${key}:1" aria-label="Вперед">›</button><button class="btn sm ghost" data-shift="${key}:0">Зараз</button></div>`;}
function loadBar(p,norm){const pct=norm?p/norm*100:(p?130:0);return `<div class="load" title="${Math.round(pct)}% норми"><i class="${pct>=120?'ov':pct>=70?'hi':''}" style="width:${Math.min(100,pct)}%"></i></div>`;}
function vPlan(){
  const a=parse(S.planAnchor);let html='';
  if(S.planMode==='week'){
    const mon=monday(a);const sun=addDays(mon,6);const t0=today();
    const label=`Тиждень ${isoWeek(mon)} · ${fmtS(mon)}–${fmtS(sun)}`;
    let tot={n:0,p:0,f:0,norm:0,ov:0,done:0};
    const days=[...Array(7)].map((_,i)=>{const d=iso(addDays(mon,i));const st=sortT(all().filter(t=>t.start===d));const du=all().filter(t=>t.due===d&&t.start!==d&&!isClosed(t));
      const p=st.reduce((s,t)=>s+num(t.plan),0),f=st.reduce((s,t)=>s+num(t.fact),0);const norm=i<5?num(LISTS.norm):0;const ov=Math.max(0,p-norm);
      tot.n+=st.length;tot.p+=p;tot.f+=f;tot.norm+=norm;tot.ov+=ov;tot.done+=all().filter(t=>isDone(t)&&t.doneAt===d).length;
      return `<div class="day ${d===t0?'today':''} ${i>4?'wknd':''}"><div class="dh">${WD[i]} ${fmtS(parse(d))}<span>${st.length} задач</span></div>${loadBar(p,norm)}
       ${st.map(t=>`<div class="mini ${isClosed(t)?'dn':''}" style="--c:${dirColor(t.dir)}" data-edit="${t.id}">${esc(t.title)}</div>`).join('')}
       ${du.map(t=>`<div class="mini dueflag" data-edit="${t.id}">⏰ строк: ${esc(t.title)}</div>`).join('')}
       <div class="dfoot"><span>план ${h(p)} / факт ${h(f)}</span>${ov?`<span class="ov">+${h(ov)}</span>`:''}</div></div>`;}).join('');
    const carry=sortT(all().filter(t=>!isClosed(t)&&deadline(t)&&deadline(t)<iso(mon)));
    html=`<div class="stats"><div class="stat"><b>${tot.n}</b><span>задач стартує</span></div><div class="stat"><b>${h(tot.p)}</b><span>план, год</span></div><div class="stat"><b>${h(tot.f)}</b><span>факт, год</span></div><div class="stat"><b>${h(tot.norm)}</b><span>норма, год</span></div><div class="stat ${tot.ov?'warn':''}"><b>${h(tot.ov)}</b><span>овертайм, год</span></div><div class="stat good"><b>${tot.done}</b><span>виконано</span></div></div>
     <div class="week">${days}</div>
     ${carry.length?`<h2>Хвости з минулих тижнів <span class="sub">(${carry.length})</span></h2><div class="list">${carry.map(t=>taskRow(t)).join('')}</div>`:''}`;
    return head('План',label,'plan')+html;
  }
  // month
  const first=new Date(a.getFullYear(),a.getMonth(),1),last=new Date(a.getFullYear(),a.getMonth()+1,0);
  const F=iso(first),L=iso(last);
  const inM=all().filter(t=>t.start&&t.start>=F&&t.start<=L);
  let rows='';const cw=iso(monday(new Date()));
  for(let m=monday(first);iso(m)<=L;m=addDays(m,7)){
    const s=iso(m)<F?F:iso(m);const e=iso(addDays(m,6))>L?L:iso(addDays(m,6));
    const l=inM.filter(t=>t.start>=s&&t.start<=e);const p=l.reduce((x,t)=>x+num(t.plan),0),f=l.reduce((x,t)=>x+num(t.fact),0);
    const norm=workdays(s,e)*num(LISTS.norm);const pct=norm?Math.round(p/norm*100):0;
    rows+=`<tr class="${iso(m)===cw?'cur':''}"><td>${isoWeek(m)}</td><td>${fmt(s)} – ${fmt(e)}</td><td class="n">${l.length}</td><td class="n">${l.filter(isDone).length}</td><td class="n">${h(p)}</td><td class="n">${h(f)}</td><td class="n">${h(norm)}</td><td class="n ${p>norm?'warn':''}">${h(Math.max(0,p-norm))}</td><td>${loadBar(p,norm)}</td><td class="n">${pct}%</td></tr>`;
  }
  const tp=inM.reduce((x,t)=>x+num(t.plan),0),tf=inM.reduce((x,t)=>x+num(t.fact),0),tn=workdays(F,L)*num(LISTS.norm);
  html=`<div class="stats"><div class="stat"><b>${inM.length}</b><span>задач у місяці</span></div><div class="stat good"><b>${inM.filter(isDone).length}</b><span>виконано</span></div><div class="stat ${inM.filter(isOver).length?'warn':''}"><b>${inM.filter(isOver).length}</b><span>прострочено</span></div><div class="stat"><b>${h(tp)}</b><span>план, год</span></div><div class="stat"><b>${h(tf)}</b><span>факт, год</span></div><div class="stat"><b>${h(tn)}</b><span>норма, год</span></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Тиж</th><th>Період</th><th class="n">Задач</th><th class="n">Вик.</th><th class="n">План</th><th class="n">Факт</th><th class="n">Норма</th><th class="n">Овертайм</th><th>Завантаження</th><th class="n">%</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h2>Навантаження по бізнес-напрямах</h2>${breakdown(inM,'dir')}`;
  return head('План',`${MONTHS[a.getMonth()]} ${a.getFullYear()}`,'plan')+html;
}
function head(title,label,key){

function breakdown(list,key,extra){

  </tbody></table></div>`;

/* ---------- view: calendar & gantt ---------- */

    <div class="dots">${st.slice(0,6).map(t=>`<i class="dot" style="background:${dirColor(t.dir)}"></i>`).join('')}</div></div>`;
  }
  const sel=S.calDay;const sl=sortT(all().filter(t=>t.start===sel||t.due===sel));
  return top+`<div class="cal">${cells}</div>
  <h2>${fmt(sel)} <span class="sub">— старт і строки цього дня</span> <button class="btn sm" data-new="${sel}">+ Задача на цей день</button></h2>
  <div class="list">${sl.length?sl.map(t=>taskRow(t)).join(''):emptyBox('На цей день нічого немає')}</div>`;
}
function gantt(a){
  const start=addDays(monday(a),-14);const W=20;const weeks=[...Array(W)].map((_,i)=>addDays(start,i*7));
  const ws=iso(weeks[0]),we=iso(addDays(weeks[W-1],6));const cw=iso(monday(new Date()));
  const l=sortT(all().filter(t=>t.start&&(S.ganttDone||!isClosed(t))&&(!S.ganttDir||(t.dir||'')===S.ganttDir)&&t.start<=we&&(t.due||t.start)>=ws)).sort((x,y)=>x.start.localeCompare(y.start));
  let mh='',prev=-1,span=0,cells=[];
  weeks.forEach(w=>{const mm=w.getMonth();if(mm!==prev){if(span)cells.push([prev,span]);prev=mm;span=1;}else span++;});cells.push([prev,span]);
  mh=cells.map(([m,s])=>`<th colspan="${s}">${MON_S[m]}</th>`).join('');
  const act=weeks.map(w=>{const s=iso(w),e=iso(addDays(w,6));return l.filter(t=>t.start<=e&&(t.due||t.start)>=s).length;});
  const rows=l.map(t=>{const s0=iso(monday(parse(t.start))),e0=iso(monday(parse(t.due&&t.due>=t.start?t.due:t.start)));
    return `<tr class="${isClosed(t)?'dn':''} ${isOver(t)?'ovr':''}"><td class="name" data-edit="${t.id}" title="${esc(t.title)}"><i class="dot" style="background:${dirColor(t.dir)}"></i> ${esc(t.title)}</td>${weeks.map(w=>{const k=iso(w);const inb=k>=s0&&k<=e0;return `<td class="w ${k===cw?'cur':''}">${inb?`<div class="gb ${k===s0?'s':''} ${k===e0?'e':''}" style="--c:${dirColor(t.dir)}"></div>`:''}</td>`;}).join('')}</tr>`;}).join('');
  return `<div class="filters"><select id="ganttDir" aria-label="Напрям"><option value="">Усі напрями</option>${opts(LISTS.dirs,S.ganttDir)}</select><label class="tog"><input type="checkbox" id="ganttDone" ${S.ganttDone?'checked':''}> Показати закриті</label><span class="sub">${l.length} задач у вікні. Смуга — від дати взяття в роботу до строку.</span></div>
  <div class="tbl-wrap"><table class="gantt"><thead><tr><th class="name">Місяць</th>${mh}</tr><tr><th class="name">ISO-тиждень</th>${weeks.map(w=>`<th class="${iso(w)===cw?'cur':''}">${isoWeek(w)}<br><span class="sub">${fmtS(w)}</span></th>`).join('')}</tr>
  <tr><th class="name">Активних задач</th>${act.map((n,i)=>`<th class="${iso(weeks[i])===cw?'cur':''}">${n||'·'}</th>`).join('')}</tr></thead>
  <tbody>${rows||`<tr><td class="name">Немає задач у цьому вікні</td>${weeks.map(()=>'<td class="w"></td>').join('')}</tr>`}</tbody></table></div>`;
}

function repRange(){
  const a=parse(S.repAnchor);
  if(S.repMode==='week'){const m=monday(a);return [iso(m),iso(addDays(m,6)),`Тиждень ${isoWeek(m)} · ${fmtS(m)}–${fmtS(addDays(m,6))}`];}
  if(S.repMode==='month'){return [iso(new Date(a.getFullYear(),a.getMonth(),1)),iso(new Date(a.getFullYear(),a.getMonth()+1,0)),`${MONTHS[a.getMonth()]} ${a.getFullYear()}`];}
  if(S.repMode==='quarter'){const q=Math.floor(a.getMonth()/3);return [iso(new Date(a.getFullYear(),q*3,1)),iso(new Date(a.getFullYear(),q*3+3,0)),`${q+1} квартал ${a.getFullYear()}`];}
  const f=S.repFrom||iso(new Date(a.getFullYear(),a.getMonth(),1)),t=S.repTo||today();return [f,t,`${fmt(f)} – ${fmt(t)}`];
}
function repData(){
  const [F,L,label]=repRange();const inP=s=>!!s&&s>=F&&s<=L;
  const planned=all().filter(t=>inP(t.start));
  const done=all().filter(t=>isDone(t)&&inP(t.doneAt||t.due||t.start));
  const onTime=done.filter(t=>!t.due||(t.doneAt||t.due)<=t.due);
  const over=all().filter(t=>isOver(t)&&deadline(t)<=L);
  const scope=[...new Map([...planned,...done].map(t=>[t.id,t])).values()];
  const p=planned.reduce((s,t)=>s+num(t.plan),0),f=scope.reduce((s,t)=>s+num(t.fact),0);
  const norm=workdays(F,L)*num(LISTS.norm);
  return {F,L,label,planned,done,onTime,over,scope,p,f,norm};
}
function vRep(){
  const r=repData();
  const rate=r.planned.length?Math.round(r.planned.filter(isDone).length/r.planned.length*100):0;
  const ot=r.done.length?Math.round(r.onTime.length/r.done.length*100):0;
  return head('Звіти',r.label,'rep')+`
  <div class="stats">
   <div class="stat"><b>${r.planned.length}</b><span>заплановано на період</span></div>
   <div class="stat good"><b>${r.done.length}</b><span>виконано за період</span></div>
   <div class="stat"><b>${rate}%</b><span>виконання плану</span></div>
   <div class="stat"><b>${ot}%</b><span>вчасно (до строку)</span></div>
   <div class="stat ${r.over.length?'warn':''}"><b>${r.over.length}</b><span>прострочено зараз</span></div>
   <div class="stat"><b>${h(r.p)} / ${h(r.f)}</b><span>план / факт, год</span></div>
   <div class="stat"><b>${r.norm?Math.round(r.p/r.norm*100):0}%</b><span>завантаження від норми ${h(r.norm)}</span></div>
  </div>
  <div class="filters"><button class="btn" data-act="summary">Текстовий звіт для месенджера</button><button class="btn" data-act="repcsv">Вивантажити CSV за період</button><button class="btn" data-gs="period">⤓ Звіт у Google Таблицю</button></div>
  <h2>По бізнес-напрямах</h2>${breakdown(r.scope,'dir')}
  <h2>По виконавцях</h2>${breakdown(r.scope,'owner')}
  <h2>По функціях</h2>${breakdown(r.scope,'func')}
  <div class="grid2"><div><h2>Виконано <span class="sub">(${r.done.length})</span></h2><div class="list">${r.done.length?sortT(r.done).map(t=>taskRow(t)).join(''):emptyBox('Ще нічого не закрито')}</div></div>
  <div><h2>Прострочено <span class="sub">(${r.over.length})</span></h2><div class="list">${r.over.length?sortT(r.over).map(t=>taskRow(t)).join(''):emptyBox('Прострочених немає')}</div></div></div>`;
}
function summaryText(){
  const r=repData();const lines=[`📊 Маркетинг — звіт: ${r.label}`,`Заплановано: ${r.planned.length} · Виконано: ${r.done.length} · Прострочено: ${r.over.length}`,`Години план/факт: ${h(r.p)} / ${h(r.f)} (норма ${h(r.norm)})`,''];
  const byDir=new Map();r.done.forEach(t=>{const k=t.dir||'Без напряму';if(!byDir.has(k))byDir.set(k,[]);byDir.get(k).push(t);});
  if(r.done.length){lines.push('✅ Виконано:');byDir.forEach((l,k)=>{lines.push(`— ${k}:`);l.forEach(t=>lines.push(`   • ${t.title}${t.owner?' ('+t.owner+')':''}`));});lines.push('');}
  if(r.over.length){lines.push('⚠️ Прострочено:');sortT(r.over).forEach(t=>lines.push(`   • ${t.title} — строк ${fmt(deadline(t))}${t.owner?', '+t.owner:''}`));lines.push('');}
  const nx=sortT(all().filter(t=>!isClosed(t)&&t.start>r.L&&t.start<=iso(addDays(parse(r.L),7))));
  if(nx.length){lines.push('🗓 Далі (7 днів):');nx.forEach(t=>lines.push(`   • ${fmt(t.start)} ${t.title}`));}
  return lines.join('\n');
}

async function connect(){

  btn.disabled=true;msg.textContent='Перевіряю…';
  try{const j=await api('ping',{}, {url,key});CONN={url,key};localStorage.setItem(CKEY,JSON.stringify(CONN));
    msg.textContent='✓ Підключено до «'+(j.name||'таблиці')+'». Завантажую задачі…';await refresh();S.view=PROFILE?'today':'profile';render();

function shiftBy(s,period){const d=parse(s);if(!d)return '';

/* ---------- CSV ---------- */
const COLS=[['n','№'],['start','Дата взяття в роботу'],['dir','Бізнес-напрям'],['title','Задача'],['type','Тип'],['func','Функція'],['period','Періодичність'],['prio','Пріоритет'],['owner','Виконавець'],['plan','План, год'],['fact','Факт, год'],['status','Статус'],['due','Строк'],['week','Тиждень'],['comment','Коментар'],['doneAt','Дата виконання']];
function toCSV(list){
  const q=v=>{v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[COLS.map(c=>c[1]).join(';')];
  sortT(list.slice()).sort((a,b)=>num(a.n)-num(b.n)).forEach(t=>rows.push(COLS.map(([k])=>{
    if(k==='week')return t.start?isoWeek(parse(t.start)):'';
    if(['start','due','doneAt'].includes(k))return q(fmt(t[k]));
    if(k==='plan'||k==='fact')return t[k]===''||t[k]==null?'':String(t[k]).replace('.',',');
    return q(t[k]);}).join(';')));
  return '\ufeff'+rows.join('\r\n');
}
async function download(name,text){
  if(dl){try{await dl.save({filename:name,data:text});return;}catch(e){if(e&&e.code==='declined')return;}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click();}catch(e){toast('Завантаження недоступне тут');}
}
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/).slice(0,5).join('\n');
  const dlm=(first.match(/\t/g)||[]).length>(first.match(/;/g)||[]).length?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;else if(c===dlm){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;}
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const dmy=s=>{s=(s||'').trim();let m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;if(y<2020)return '';return y+'-'+pad(+m[2])+'-'+pad(+m[1]);}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:'';};
async function importCSV(text){
  const rows=parseCSV(text);const hi=rows.findIndex(r=>r.some(c=>/^\s*Задача\s*$/i.test(c)));
  if(hi<0){toast('Не знайдено колонку «Задача»');return;}
  const H=rows[hi].map(c=>c.trim().toLowerCase());
  const find=(...keys)=>H.findIndex(c=>keys.some(k=>c.includes(k)));
  const idx={n:H.findIndex(c=>c==='№'||c==='no'),start:find('взяття','start'),dir:find('напрям'),title:H.findIndex(c=>c==='задача'),type:find('тип'),func:find('функц'),period:find('періодич'),prio:find('пріоритет'),owner:find('виконавець'),plan:find('план'),fact:find('факт'),status:find('статус'),due:find('строк'),comment:find('коментар'),doneAt:find('дата виконання')};
  const clean=v=>(v||'').replace(/\s*▾\s*/g,'').trim();
  const existing=new Set(all().map(t=>(t.n||'')+'|'+(t.title||'').trim()));
  let added=0;const batch=[];
  for(const r of rows.slice(hi+1)){
    const g=k=>idx[k]>=0?clean(r[idx[k]]):'';const title=g('title');if(!title)continue;
    const t={n:g('n')?num(g('n')):'',start:dmy(g('start')),dir:g('dir'),title,type:g('type'),func:g('func'),period:g('period'),prio:g('prio'),owner:g('owner'),plan:g('plan')?num(g('plan')):'',fact:g('fact')?num(g('fact')):'',status:g('status')||'Очікує плану',due:dmy(g('due')),comment:g('comment'),doneAt:dmy(g('doneAt')),created:today()};
    if(existing.has((t.n||'')+'|'+t.title))continue;existing.add((t.n||'')+'|'+t.title);
    t.id=newId();batch.push(t);tasks.set(t.id,t);added++;
  }
  if(batch.length){toast('Записую в таблицю…');try{for(let i=0;i<batch.length;i+=40){await api('bulk',{tasks:batch.slice(i,i+40)});}await refresh(true);}catch(e){toast('Імпорт не завершено: '+e.message);}}
  toast(`Імпортовано задач: ${added}`);render();
}

/* ---------- export to Google Sheets ---------- */
function exportScope(scope){
  if(scope==='filter')return {list:filtered(),label:'поточна вибірка'};
  if(scope==='open')return {list:all().filter(t=>!isClosed(t)),label:'відкриті задачі'};
  if(scope==='period'){const r=repData();const l=r.scope.concat(r.over.filter(t=>!r.scope.includes(t)));return {list:l,label:'звіт: '+r.label,rep:r};}

}
function summaryRows(list,key,title){
  const m=new Map();list.forEach(t=>{const k=t[key]||'—';if(!m.has(k))m.set(k,[]);m.get(k).push(t);});
  const rows=[...m.entries()].sort((a,b)=>b[1].length-a[1].length).map(([k,l])=>[k,l.length,l.filter(t=>!isClosed(t)).length,l.filter(isDone).length,l.filter(isOver).length,l.reduce((s,t)=>s+num(t.plan),0),l.reduce((s,t)=>s+num(t.fact),0)]);
  return [[title,'Задач','Відкрито','Виконано','Прострочено','План, год','Факт, год']].concat(rows);
}
function buildSheets(sc,withSum){

    const L={status:'Статус',prio:'Пріоритет',owner:'Виконавець',dir:'Напрям',start:'Дата старту',due:'Строк',plan:'План',fact:'Факт'};
    if(f==='start'&&v&&S.view==='inbox')toast('Заплановано на '+fmt(v));
    else if(f==='due'&&v&&o.start&&v<o.start)toast('Увага: строк раніше дати старту');
    else toast((L[f]||'Поле')+' збережено');
    render();}
});
document.addEventListener('keydown',e=>{
  if($('#dlg').open)return;const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;
  if(e.key==='n'||e.key==='т'){e.preventDefault();openTask(null);}
  if(e.key==='/'){e.preventDefault();S.view='tasks';render();const q=$('#q');if(q)q.focus();}
});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;dragId=c.dataset.drag;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(x){}});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c)c.classList.remove('dragging');document.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop'));dragId=null;});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-dropdir]');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.drop').forEach(x=>{if(x!==col)x.classList.remove('drop');});col.classList.add('drop');});
document.addEventListener('drop',async e=>{const col=e.target.closest&&e.target.closest('[data-dropdir]');if(!col||!dragId)return;e.preventDefault();const t=tasks.get(dragId);const nd=col.dataset.dropdir;dragId=null;col.classList.remove('drop');
  if(!t||(t.dir||'')===nd)return;await putTask(Object.assign({},t,{dir:nd}));toast('Перенесено в «'+(nd||'Без напряму')+'»');render();});
$('#fab').addEventListener('click',()=>openTask(null,S.view==='cal'?{start:S.calDay}:null));
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').close();});
let FSCALE=1;try{FSCALE=parseFloat(localStorage.getItem('honey-fs'))||1;}catch(e){}
function applyScale(){const mob=window.matchMedia?window.matchMedia('(max-width:820px)').matches:window.innerWidth<=820;const m=mob?1.1:1;document.documentElement.style.setProperty('--fs',(FSCALE*m).toFixed(3));}
function setScale(v){FSCALE=v;try{localStorage.setItem('honey-fs',String(v));}catch(e){}applyScale();}
window.addEventListener('resize',applyScale);
function applyTheme(){let v='auto';try{v=localStorage.getItem('honey-theme')||'auto';}catch(e){}if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);}
applyTheme();applyScale();
boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
